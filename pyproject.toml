[project]
name = "tunesmith"
version = "0.1.0"
description = "Text to instrumental melody: describe a piece of music, get a MIDI melody you can play, see and edit."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "pydantic>=2.6",
  "miditok>=3.0.4,<4",
  "symusic>=0.5",
  "tqdm>=4.66",
  "transformers>=4.56",
  "peft>=0.13",
  "huggingface_hub>=0.25",
  "accelerate>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "matplotlib>=3.8",
]

[project.scripts]
tunesmith = "tunesmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tunesmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
markers = ["slow: trains a tiny model end to end (deselect with -m \"not slow\")"]

# ---------------------------------------------------------------- pixi

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
tunesmith = { path = ".", editable = true }

# CPU build of PyTorch: app, tests, graders' machines.
[tool.pixi.feature.cpu.pypi-dependencies]
torch = { version = ">=2.5", index = "https://download.pytorch.org/whl/cpu" }

# CUDA build of PyTorch: training on the RTX 4070 laptop GPU or on Duke CS OnDemand (Linux).
# The PyPI wheels bundle the CUDA runtime; only an NVIDIA driver is needed.
[tool.pixi.feature.cuda]
platforms = ["win-64", "linux-64"]

[tool.pixi.feature.cuda.pypi-dependencies]
torch = { version = ">=2.5", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"

[tool.pixi.environments]
default = { features = ["cpu", "dev"] }
cuda = { features = ["cuda", "dev"] }

[tool.pixi.activation.env]
TOKENIZERS_PARALLELISM = "false"
HF_HUB_DISABLE_TELEMETRY = "1"

[tool.pixi.tasks]
test = "pytest -q -m \"not slow\""
test-all = "pytest -q"
# data
download-data = "python -m tunesmith.data.download"
prepare-data = "python -m tunesmith.data.prepare"
synth-data = "python -m tunesmith.data.synthetic"
# composer (text-free part: attributes -> melody)
train-composer = "python -m tunesmith.train.train_composer"
# parser (text -> attributes)
make-parser-data = "python -m tunesmith.understand.make_dataset"
download-parser-base = "python -m tunesmith.understand.download_base"
train-parser = "python -m tunesmith.understand.train_parser"
# evaluation, CLI, app
evaluate = "python -m tunesmith.eval.run_eval"
evaluate-parser = "python -m tunesmith.eval.eval_parser"
generate = "python -m tunesmith.cli generate"
parse = "python -m tunesmith.cli parse"
app = "python -m tunesmith.app.server"
smoke = "python -m tunesmith.smoke"
fetch-soundfont = "python -m tunesmith.render.fetch_soundfont"
