# Ensemble composer, MEDIUM size (about 86M parameters; for Duke CS OnDemand or another >=16 GB GPU):
# the reference Transformer (src/tunesmith/model/transformer_ref.py) with a
# 2,048-token context, trained on multi-instrument windows.
# Batch 12 x 4 accumulation keeps 48 sequences per optimizer step, as in the melody configs.

data_dir: data/processed/midicaps_ensemble
out_dir: models/composer/ensemble-medium

model:
  type: transformer_ref
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_ff: 3072
  dropout: 0.1
  max_seq_len: 2048
  positional: learned      # learned | rope (optional extension)

train:
  batch_size: 12
  length_bucketing: true   # batch similar lengths together (~3x less padding)
  grad_accum: 4
  lr: 3.0e-4
  min_lr_ratio: 0.1        # cosine decays to lr * min_lr_ratio
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 1000
  max_steps: 40000
  eval_every: 1000
  eval_batches: 50
  save_every: 2000
  log_every: 50
  grad_clip: 1.0
  amp: auto                # auto | bf16 | fp16 | off
  num_workers: 2
  seed: 0
  early_stop_patience: 5   # evaluations without val-loss improvement

augment:
  transpose_range: [-5, 6]  # semitones, inclusive; the KEY token is shifted too
  transpose_prob: 0.8
  attr_dropout: 0.15        # each control token -> NULL with this probability
  uncond_prob: 0.1          # all control tokens -> NULL (enables classifier-free guidance)
